name: Prepare tested GitHub release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read release version
        id: version
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = json.load(open('custom_components/weihnachtszentrale/manifest.json'))['version']
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Test and build
        shell: bash
        run: |
          set -e
          python -m unittest discover -s tests
          for file in custom_components/weihnachtszentrale/frontend/*.js; do node --check "$file"; done
          for test in tests/*.cjs; do node "$test"; done
          python scripts/build_zip.py
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          body_path: docs/RELEASE_NOTES.md
          files: |
            artifacts/*.zip
            artifacts/*.zip.sha256
